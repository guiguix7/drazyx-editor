name: Validate skill packages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate committed packages and mirrors
        run: npm run check
      - name: Smoke-test canonical-to-mirror synchronization
        run: npm run sync
      - name: Validate synchronized packages
        run: npm run check
